name: Build diagnostics
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Prisma generate
        run: npx prisma generate
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Next build
        env:
          DATABASE_URL: postgresql://user:pass@127.0.0.1:5432/moriah
          SESSION_SECRET: diagnostic-only-not-production
        run: npm run build
