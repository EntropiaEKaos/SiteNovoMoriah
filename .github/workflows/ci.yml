name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Production dependency security gate
        run: npm audit --omit=dev --audit-level=critical
      - run: npx prisma validate
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/moriah
      - run: npx prisma generate
      - name: Channel snapshot safety tests
        run: node --experimental-strip-types --test tests/channel-sync-safety.test.mjs tests/smoobu-mapping.test.mjs tests/smoobu-reservation-diagnostics.test.mjs tests/smoobu-rate-policy.test.mjs
      - run: npm run typecheck
      - run: npm run build
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/moriah
